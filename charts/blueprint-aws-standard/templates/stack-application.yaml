{{- $root := . }}
{{- $stackApps := .Values.stackApps | default (list) }}
{{- if eq (len $stackApps) 0 }}
{{- $stackApps = list (dict
      "name" "stack"
      "namespace" .Values.stack.namespace
      "createNamespace" .Values.stack.createNamespace
      "valueFiles" .Values.stack.valueFiles
      "extraValueFiles" (.Values.stack.extraValueFiles | default (list))
      "values" (.Values.stack.values | default dict)
      "enabled" .Values.enabled.stack) }}
{{- end }}
{{- range $stackApp := $stackApps }}
{{- if or (not (hasKey $stackApp "enabled")) $stackApp.enabled }}
{{- $stackAppValues := $stackApp.values | default dict }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ include "blueprint.fullname" $root }}-{{ $stackApp.name }}
  namespace: {{ $root.Values.argocd.namespace }}
  labels:
    {{- include "blueprint.argoLabels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ printf "%s-%s" (include "blueprint.fullname" $root) $stackApp.name | quote }}
    jetscale.ai/runtime-role: "workload"
    jetscale.ai/workload-name: {{ $stackApp.name | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ $root.Values.argocd.project }}

  sources:
    # Source 1: Helm values from the stack repo (layered, per-environment)
    - repoURL: {{ $root.Values.repositories.stackValues.repoURL }}
      targetRevision: {{ $root.Values.repositories.stackValues.targetRevision }}
      ref: stackValues

    # Source 2: OCI chart from GHCR
    - repoURL: {{ $root.Values.repositories.stack.repoURL }}
      chart: {{ $root.Values.repositories.stack.chart }}
      targetRevision: {{ $root.Values.versions.stack }}
      helm:
        releaseName: {{ $stackApp.namespace }}
        valueFiles:
          {{- range $stackApp.valueFiles }}
          - $stackValues/{{ . }}
          {{- end }}
          {{- range $stackApp.extraValueFiles | default list }}
          - $stackValues/{{ . }}
          {{- end }}
        {{- if gt (len $stackAppValues) 0 }}
        values: |
{{ toYaml $stackAppValues | indent 10 }}
        {{- end }}

  destination:
    server: {{ $root.Values.cluster.server }}
    namespace: {{ $stackApp.namespace }}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace={{ $stackApp.createNamespace }}
      - ServerSideApply=true
      - ServerSideDiff=true
    retry:
      limit: 3
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 3m
---
{{- end }}
{{- end }}
