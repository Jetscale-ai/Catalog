# Default values for blueprint-aws-standard
# This chart renders ArgoCD Application manifests for AWS EKS clusters.
# Instance-specific values are injected by ../fleet per-cluster values.yaml.

# ArgoCD project that owns the rendered Applications
argocd:
  project: global-services
  namespace: argocd

# Versions (injected by ../fleet — no defaults; must be pinned)
versions:
  stack: ""
  observability: ""

# Repository configuration
repositories:
  stack:
    # Argo Helm OCI sources point at the published repo base; chart name stays separate.
    repoURL: ghcr.io/jetscale-ai/charts
    chart: jetscale
  stackValues:
    repoURL: https://github.com/Jetscale-ai/stack.git
    targetRevision: main
  observability:
    repoURL: oci://ghcr.io/jetscale-ai/charts/observability-core

# Cluster identity (injected by ../fleet)
cluster:
  name: ""
  server: https://kubernetes.default.svc

# Per-workload configuration
stack:
  namespace: ""
  createNamespace: true
  # Ordered list of Helm value files from the stack repo (relative paths)
  valueFiles:
    - envs/aws/aws.yaml
    - envs/aws/prod/default.yaml
  extraValueFiles: []

# Preferred multi-app configuration for one or more ../stack umbrella apps on a
# single runtime cluster. When non-empty, the chart renders one child
# Application per entry. Legacy single-stack values remain supported via the
# `stack` block above for backward compatibility.
stackApps: []

# Application enablement flags
enabled:
  stack: true
  observability: false
