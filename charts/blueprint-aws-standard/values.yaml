# Default values for blueprint-aws-standard
# This chart renders ArgoCD Application manifests for AWS EKS clusters

# Versions (injected by ../fleet)
versions:
  system: ""      # Ingress Nginx, Cert Manager
  stack: ""       # JetScale App
  observability: ""  # Loki/Grafana

# Repository configuration
repositories:
  observability:
    repoURL: oci://ghcr.io/jetscale-ai/charts/observability-core
  stack:
    repoURL: ""   # To be configured per cluster

# Cluster configuration
cluster:
  name: ""        # Injected by fleet
  server: ""      # Injected by fleet

# Application enablement flags
enabled:
  system: true
  stack: true
  observability: true
