name: "CD: Publish Blueprints"
run-name: >-
  ${{
    github.event_name == 'workflow_run' &&
    format('CD: Publish Blueprints ← {0}', github.event.workflow_run.head_branch) ||
    format('CD: Publish Blueprints (manual:{0})', github.ref_name)
  }}

on:
  workflow_run:
    workflows: ["CI: Validate Blueprints"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  check-ci:
    name: "CD: Check CI Status"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
    steps:
      - name: CI workflow did not succeed
        run: |
          echo "::error::CI workflow did not succeed (conclusion: ${{ github.event.workflow_run.conclusion }})"
          exit 1

  release:
    name: "CD: Release AWS Blueprint"
    needs: [check-ci]
    if: >-
      always() && (needs.check-ci.result == 'success' || needs.check-ci.result == 'skipped')
    runs-on: ubuntu-latest

    env:
      RELEASE_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
      CHECKOUT_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      CHANGELOG_FILE: .generated-go-semantic-release-changelog.md
      CHART_PATH: charts/blueprint-aws-standard
      REGISTRY: ghcr.io

    steps:
      - name: Enforce main-only release
        run: |
          if [ "${RELEASE_BRANCH}" != "main" ]; then
            echo "::error::Catalog releases are main-only. Got: ${RELEASE_BRANCH}"
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.CHECKOUT_REF }}
          token: ${{ secrets.JETSCALEBOT_GITHUB_TOKEN }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Install semantic-release CLI
        run: |
          curl -sSL https://get-release.xyz/semantic-release/linux/amd64 -o /usr/local/bin/semantic-release
          chmod +x /usr/local/bin/semantic-release

      - name: Align release branch context
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B "${RELEASE_BRANCH}" "${CHECKOUT_REF}"

      - name: Semantic release
        id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.JETSCALEBOT_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_REF_NAME="${RELEASE_BRANCH}"
          export GITHUB_REF="refs/heads/${RELEASE_BRANCH}"
          export GITHUB_SHA="${CHECKOUT_REF}"

          EXIT_CODE=0
          semantic-release \
            --version-file \
            --changelog "${CHANGELOG_FILE}" \
            --token "${GITHUB_TOKEN}" \
            --allow-initial-development-versions \
            --force-bump-patch-version || EXIT_CODE=$?

          if [ "${EXIT_CODE}" -ge 60 ] && [ "${EXIT_CODE}" -lt 70 ]; then
            echo "version=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "${EXIT_CODE}" -ne 0 ]; then
            exit "${EXIT_CODE}"
          fi

          VERSION="$(tr -d '\n' < .version)"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Publish AWS blueprint chart
        if: steps.semrel.outputs.version != ''
        working-directory: ${{ env.CHART_PATH }}
        env:
          VERSION: ${{ steps.semrel.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.JETSCALEBOT_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          OWNER_LC="$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          OCI_BASE="oci://${REGISTRY}/${OWNER_LC}/catalog"

          echo "${TOKEN}" | helm registry login "${REGISTRY}" --username "${{ github.actor }}" --password-stdin
          yq -i ".version = \"${VERSION}\"" Chart.yaml
          yq -i ".appVersion = \"${VERSION}\"" Chart.yaml
          helm dependency update
          helm package .
          helm push *.tgz "${OCI_BASE}"

      - name: Commit chart version bump
        if: steps.semrel.outputs.version != ''
        env:
          VERSION: ${{ steps.semrel.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "jetscale-bot"
          git config --global user.email "bot@jetscale.ai"
          git add "${CHART_PATH}/Chart.yaml"
          git add "${CHART_PATH}/Chart.lock" || true
          git commit -m "chore(release): v${VERSION} [skip ci]"
          git push origin "HEAD:${RELEASE_BRANCH}"

      - name: Release summary
        shell: bash
        run: |
          {
            echo "## Catalog Release"
            echo ""
            if [ -n "${{ steps.semrel.outputs.version }}" ]; then
              echo "- Published chart: \`blueprint-aws-standard\`"
              echo "- Version: \`${{ steps.semrel.outputs.version }}\`"
              echo "- OCI base: \`oci://ghcr.io/jetscale-ai/catalog\`"
              echo "- Consumed by: \`global-argocd.catalogBlueprintVersion\`"
            else
              echo "- No release created from semantic commits."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
