name: "CI: Validate Blueprints"

on:
  pull_request:
    paths:
      - "charts/**"
      - ".github/workflows/**"
      - ".release.yml"
      - "README.md"
      - "ROADMAP.md"
      - "AGENTS.md"
      - ".agents/AGENTS.md"
  push:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/**"
      - ".release.yml"
      - "README.md"
      - "ROADMAP.md"
      - "AGENTS.md"
      - ".agents/AGENTS.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: "CI: Lint And Render"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint AWS blueprint
        run: helm lint charts/blueprint-aws-standard

      - name: Lint Azure blueprint
        run: helm lint charts/blueprint-azure-standard

      - name: Render AWS blueprint
        run: |
          helm template global-services-live charts/blueprint-aws-standard \
            --set versions.stack=0.32.1 \
            --set cluster.name=global-services-live \
            --set "stackApps[0].name=jetscale-console" \
            --set "stackApps[0].namespace=jetscale-console" \
            --set "stackApps[0].valueFiles[0]=envs/aws/aws.yaml" \
            --set "stackApps[0].valueFiles[1]=envs/aws/prod/default.yaml" \
            --set "stackApps[0].extraValueFiles[0]=envs/aws/prod/jetscale-console.yaml"
